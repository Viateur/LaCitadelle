<!DOCTYPE HTML>
<html>
	<head>
		<title></title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="../css/style.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
      <style>
 

.container {
width: 90%;
margin: auto;
text-align: left;
display: flex;
grid-template-columns: 1.8fr 1.2fr;
gap: 1rem;
padding: 2.5rem 1rem;
text-transform: capitalize;
border: 1px solid transparent;
border-radius: .3rem;
box-shadow: 1px 2px 4px 0.5px #03010f;
}

.main-video,
.video-playlist {
width: 100%;
height: 30rem;
}

.main-video .title {
margin-top: 1rem;
}

.video-playlist .title {
padding-left: 1rem;
}

.video-playlist>p {
padding: 1rem;
color: gold;
}

.video-playlist .videos {
height: 70%;
overflow-y: auto;
}

.video-playlist .videos::-webkit-scrollbar {
width: .4rem;
border-radius: .4rem;
background-color: #0005;
}

.video-playlist .videos::-webkit-scrollbar-thumb {
border-radius: .4rem;
background-color: #fff;
}

.video-playlist .videos .video {
position: relative;
width: 100%;
height: 4rem;
display: flex;
justify-content: center;
align-items: center;
padding: 0 1rem;
margin-top: .1rem;
cursor: pointer;
border-radius: .5rem;
}

.video-playlist .videos .video:hover {
background-color: #0003;
}

.video-playlist .videos .video.active {
background-color: #0003;
color: gold;
}

.main-video video {
width: 100%;
border-radius: .5rem;
}

.video img {
position: absolute;
left: 1rem;
top: 50%;
transform: translateY(-50%);
width: 1.5rem;
height: 1.5rem;
filter: invert(100%);
}

.video-playlist .videos .video.active img {
filter: invert(100%) sepia(100%) saturate(2000%) hue-rotate(360deg);
}

.video p {
margin-left: 2.5rem;
}

.video h3 {
width: 23rem;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
font: 100 1rem sans-serif;
padding: 0 .5rem;
}
        
@media screen and (min-width: 601px) and (max-width: 1000px) {

  .video h3 {
    width: 5rem;
}
  
  .list-video{
     overflow : auto;
     height: 250px;
}
    .main-video, .video-playlist {
    width: unset;
    height: unset;
}
  .video-playlist .videos {
    background-color: gray;
}
}
@media screen and (max-width: 600px) {
.container {
display: grid;
row-gap: 20px;
grid-template-columns: auto;
padding: 10px;
}

.video-screen{
width:400px;
height: 265px; 
 }
 .main-video video {
    width: 100%; 
    border-radius: .5rem;
}
  
  .main-video, .video-playlist {
    width: unset;
    height: unset;
}
 .video-playlist .videos .video {
   justify-content: left;
}
  
  .video h3 {
    width: 6rem;
}
  
  .list-video{
     overflow : auto;
     height: 200px;
}
  .video-playlist .videos {
    background-color: grey;
}
}
     </style>
	
	</head>
	<body>
		<link href="https://fonts.googleapis.com/css2?family=Rozha+One&display=swap" rel="stylesheet">
		   <section  class ="banner">
			  <div class="header_container">
			  	<label for="menu-control" class="hamburger">
					<li class="hamburger__icon"></li>
					<li class="hamburger__icon"></li>
					<li class="hamburger__icon"></li>
		        </label>
		      <div class ="logoTitre">
	              <div id="titre">
	              	<h1>LA CITADELLE MEDIA</h1>
	              </div>
	              </div>
             </div>

   
        
                 
         <main class="container">
              <section class="main-video">
              <video class ="video-screen" src="../videos/[Qu'aurait fait Jésus 1] Rendre ou Garder.mp4"  controls autoplay></video>
                 <h3 class="title">Rendre ou Garder</h3>
              </section>
              
              <section class="video-playlist"> 
               <div class ="list-video" >
              <div class="videos">
              </div>
              </div>
              </section>
		</main>
	
    
			<input type="checkbox" id="menu-control" class="menu-control">
			<aside class="sidebar">
				<nav class ="sidebar__menu">
						<a href="http://lacitadellemedia.net/">Accueil</a>
                         <a href="http://lacitadellemedia.net/themes.html">Themes</a>
                   <a href="http://lacitadellemedia.net/audios_2023.html">Audios 2023</a>
					<a href="http://lacitadellemedia.net/audios_2022.html">Audios 2022</a>
					<a href="http://lacitadellemedia.net/videos.html">Videos</a>
				</nav>
				<label for="menu-control"class="sidebar__close">
				</label>
			</aside>

		</section>
		
      <script>
       
const main_video = document.querySelector('.main-video video');
const main_video_title = document.querySelector('.main-video .title');
const video_playlist = document.querySelector('.video-playlist .videos');

let data = [
{
'id': 'a1',
'title': 'Rendre ou Garder',
'name': '[Qu\'aurait fait Jésus 1] Rendre ou Garder.mp4',
'duration': '0:27',
},
{
'id': 'a2',
'title': 'Parler ou se Taire',
'name': '[Qu\'aurait fait Jésus 2] Parler ou se Taire.mp4',
'duration': '2:29',
},
{
'id': 'a3',
'title': 'Lancer le Feu ou Pardonner',
'name': '[Qu\'aurait fait Jésus 3] Lancer le Feu ou Pardonner.mp4',
'duration': '3:01',
}
];

data.forEach((video, i) => {
let video_element = `
<div class="video" data-id="${video.id}">
<img src="images/play.svg" alt="">
<p>${i + 1 > 9 ? i + 1 : '0' + (i + 1)}. </p>
<h3 class="title">${video.title}</h3>
<p class="time">${video.duration}</p>
</div>
`;
video_playlist.innerHTML += video_element;
})

let videos = document.querySelectorAll('.video');
videos[0].classList.add('active');
videos[0].querySelector('img').src = 'images/pause.svg';

videos.forEach(selected_video => {
selected_video.onclick = () => {

for (all_videos of videos) {
all_videos.classList.remove('active');
all_videos.querySelector('img').src = 'images/play.svg';

}

selected_video.classList.add('active');
selected_video.querySelector('img').src = 'images/pause.svg';

let match_video = data.find(video => video.id == selected_video.dataset.id);
main_video.src = '../video/' + match_video.name;
main_video_title.innerHTML = match_video.title;
}
});
    </script>
	</body>
</html>
