<script>
    const playground = document.querySelector('.playground');
    const recto_activeCard = document.querySelector('.recto_activeCard');
    const verso_activeCard = document.querySelector('.verso_activeCard');
    const playground_card = document.querySelector('.card');
    var i = 1;
    var newStep = "true";



    // Get the button, and when the user clicks on it, execute myFunction
    document.getElementById("recto_activeCard_frame").onclick = function() {
        myFunction()
    };

    /* myFunction toggles between adding and removing the show class, which is used to hide and drag1show the dropdown content */
    function myFunction() {
        if (newStep == "false") {
            verso_activeCard.innerHTML = `<img id="verso_activeCard" src="imagesMMCJ/verso_versetsBiblique_${i}.png" />`

        }
        recto_activeCard.className = "card recto_activeCard hide";
        verso_activeCard.className = "card verso_activeCard show";
    };


    // Get the button, and when the user clicks on it, execute myFunction
    document.getElementById("verso_activeCard_frame").onclick = function() {
        myFunctionVerso()
    };

    /* myFunction toggles between adding and removing the show class*/

    function myFunctionVerso() {

       document.getElementById("verso_activeCard").classList.toggle("rotate");
    };


    document.getElementById("next").onclick = function() {
        myFunctionDrag()
    };

    function myFunctionDrag() {
        verso_activeCard.className = "card verso_activeCard show transition_margin out";
        recto_activeCard.className = "card recto_activeCard transition_index up";
        i++;
        newStep = "false";
    };
</script>
